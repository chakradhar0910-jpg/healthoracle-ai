stages:
  - test
  - lint
  - format
  - type_check
  - coverage

test-job:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov httpx
  script:
    - python backend/train.py
    - pytest --cov=backend --cov-report=term-missing tests/

lint-job:
  stage: lint
  image: python:3.11
  before_script:
    - pip install ruff
  script:
    - ruff check backend/ tests/

format-job:
  stage: format
  image: python:3.11
  before_script:
    - pip install ruff
  script:
    - ruff format --check backend/ tests/

type-check-job:
  stage: type_check
  image: python:3.11
  before_script:
    - pip install mypy types-requests types-urllib3 -r requirements.txt
  script:
    - mypy backend/ tests/

coverage-job:
  stage: coverage
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov httpx
  script:
    - pytest --cov=backend --cov-report=term-missing --cov-fail-under=80 tests/

